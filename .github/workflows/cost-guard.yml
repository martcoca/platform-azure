name: Cost guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact cost-guard exit codes
        run: bash scripts/test-cost-guard.sh

  denylist-agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The Policy denylist and the guard denylist must agree
        run: bash scripts/check-denylist-agreement.sh
      - name: The agreement check must be able to fail
        run: |
          jq 'map(select(.resource_type != "azurerm_firewall"))' \
            config/cost-guard-denylist.json > "$RUNNER_TEMP/holed.json"
          cp "$RUNNER_TEMP/holed.json" config/cost-guard-denylist.json
          if bash scripts/check-denylist-agreement.sh; then
            echo "Expected a hole in the guard denylist to be reported." >&2
            exit 1
          fi
